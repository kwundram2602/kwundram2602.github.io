---
#Add "layout: compress" here to compress the html code
---
<!DOCTYPE html>
<!--[if IE 8]> <html lang="en" class="ie8"> <![endif]-->
<!--[if IE 9]> <html lang="en" class="ie9"> <![endif]-->
<!--[if !IE]><!-->
<html lang="en"> <!--<![endif]-->
{% include head.html %}

<body>
  <div class="action-buttons d-print-none" role="group" aria-label="Export CV">
    <button type="button" onclick="print()" class="print-button" aria-label="Print CV">
      <i class="fas fa-print"></i><span class="label">Print</span>
    </button>
    <button type="button" onclick="generatePDF()" class="pdf-button" id="pdfButton" aria-label="Download CV as PDF">
      <i class="fas fa-file-pdf"></i><span class="label">PDF</span>
    </button>
  </div>

  <div class="wrapper">
    {% include sidebar.html %}

    <div class="main-wrapper">
      {{ content }}
    </div>
  </div>

  {% include footer.html %}

  {% include scripts.html %}
  <script src="{{ site.baseurl }}/assets/js/skill-years.js"></script>
  <script src="{{ site.baseurl }}/assets/js/pdf-generator.js"></script>
  <script>
    // Fade sections in as they scroll into view (CSS disables it for reduced motion).
    (function () {
      var main = document.querySelector(".main-wrapper");
      if (!main || !("IntersectionObserver" in window)) return;
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { rootMargin: "0px 0px -40px 0px" });
      main.querySelectorAll(".section").forEach(function (section) {
        observer.observe(section);
      });
      main.classList.add("reveal-ready");
    })();
  </script>
</body>

</html>
