profile:
  summary: |
    Geoinformatics graduate student, currently in the
    M.Sc. Applied Earth Observation and Geoanalysis programme at the University
    of Würzburg, run in collaboration with the Earth Observation Center of the
    German Aerospace Center (DLR-EOC).

    In my master's studies, I currently focus on remote sensing and deep learning for
    image segmentation - whilst also gaining experience in the analysis of SAR,
    optical and thermal data, and cloud-based processing of EO data.

# Entries (education, internships, work): title, org, place, time, note, details (markdown)
education:
- title: Master of Science Applied Earth Observation and Geoanalysis
  org: Institute of Geography and Geology
  place: Würzburg
  time: 2025 – ongoing
  note: no grade yet
  details: |
    M.Sc. programme in collaboration with the Earth Observation Center at the
    German Aerospace Center (DLR-EOC).

    **Selection of current courses:**
    - AI approaches in Earth Observation — PyTorch for classification, image segmentation and object detection tasks
    - Earth Observation Cloud Computing
    - Risk and Disaster Earth Observation
- title: Bachelor of Science Geoinformatics
  org: Institute for Geoinformatics
  place: Münster
  time: 2021 – 2025
  note: "grade: 2,2"
  details: |
    Fundamentals of mathematics and computer science, geosciences and, of
    course, fundamentals and advanced elements of geoinformatics.

    **Relevant coursework:**
    - Machine Learning for openEOcubes
    - Machine Learning
    - Remote Sensing courses
- title: Bachelor of Arts Public Governance across Borders
  org: Institute of Political Science
  place: Münster
  time: 2020 – 2021
- title: Bachelor of Science VWL (Economics)
  org: Martin-Luther-Universität Halle-Wittenberg
  place: Halle (Saale)
  time: 2019 – 2020
- title: Secondary School
  org: Europaschule Gymnasium Westerstede
  place: Westerstede
  time: 2011 – 2019
  details: |
    Qualification: Abitur, Graduation: 2019

thesis:
  title: "Animal Welfare in Laboratory Conditions: Monitoring Zebrafish Behavior Using Deep Learning"
  grade: "1,7"
  supervisors: Prof. Dr. Benjamin Risse
  university: University of Münster, 2025
  description: >
    This research implemented and surveyed deep learning methods to measure the
    effect of enrichment in water tanks on zebrafish.

internships:
- title: Internship (planned)
  org: Remote Sensing Solutions (RSS)
  place: Munich
  time: Feb. 2027 – Apr. 2027
  details: |
    Munich-based company providing remote sensing solutions for environmental
    monitoring, agriculture and disaster management.
- title: DLR Internship
  org: Island volcanism — multi-sensor remote sensing (SAR, optical, thermal)
  time: Oct. 2026 – Dec. 2026
  details: |
    German Aerospace Center (DLR). Exploring methods for mapping pumice rafts after
    submarine volcanic eruptions using remote sensing data.
    - Training segmentation models using foundation models such as Thor and TerraMind
- title: ESA Academy Training
  org: Disruptive Innovation and Commercialisation in Earth Observation
  time: Jul. 2026
  details: |
    European Space Agency (ESA) training programme on innovation and
    commercialisation pathways for Earth observation technologies and services.
- title: '"Innovation Lab"'
  org: Crown and Deadwood Segmentation
  time: Jan. 2026 – ongoing
  details: |
    In cooperation with the Pattern Recognition Department at the Institute of
    Computer Science, University of Würzburg. Segmentation of tree crowns and
    deadwood from multispectral drone imagery using deep learning.

work:
- title: Student assistant
  org: Max-Planck-Institute of Animal Behavior
  time: Feb. 2026 – May 2026
  details: |
    Providing and analyzing Earth observation data.
- title: Student assistant
  org: University of Münster
  place: Münster
  time: Jul. 2024 – Sep. 2025
  details: |
    Student assistant in the TinyAIoT project at the Spatial Intelligence Lab.
    **Tasks and achievements:**
    - Training of machine learning models with TensorFlow and PyTorch
    - Compression / quantization of ML models
    - Integrating High Performance Computing (HPC) into the training process
    - Deployment on microcontrollers, profiling, measuring inference time
- title: Student assistant
  org: University of Münster
  place: Münster
  time: Oct. 2022 – Mar. 2023 & Oct. 2023 – Mar. 2024
  details: |
    Supervising exercises in the module "Introduction to Geoinformatics".

