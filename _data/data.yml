career-profile:
  title: Career Profile
  summary: |
    Earth observation and geoinformatics graduate student, currently in the
    M.Sc. Applied Earth Observation and Geoanalysis programme at the University
    of Würzburg, run in collaboration with the Earth Observation Center of the
    German Aerospace Center (DLR-EOC).

    My work sits between remote sensing and machine learning: deep learning for
    image segmentation and object detection, multi-sensor analysis of SAR,
    optical and thermal data, and cloud-based processing of large EO archives.
    Alongside that I have hands-on experience with efficient and embedded ML —
    model compression, quantisation and HPC-based training from the TinyAIoT
    project at the Spatial Intelligence Lab in Münster.

