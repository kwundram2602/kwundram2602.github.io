<h2 class="section-title">
  {%- if include.icon -%}
  <span class="section-icon fa-stack fa-xs" aria-hidden="true">
    <i class="fas fa-circle fa-stack-2x"></i>
    <i class="fas fa-{{ include.icon }} fa-stack-1x fa-inverse"></i>
  </span>
  {%- endif -%}
  <span class="section-title-text">{{ include.title }}</span>
</h2>
