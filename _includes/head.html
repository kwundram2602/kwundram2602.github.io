<head>
  <title>{{ site.title }}</title>

  <!-- Meta -->
  <meta charset="utf-8">
  {% if site.chrome_mobile_color %}
  <meta name="theme-color" content="{{ site.chrome_mobile_color }}">
  {% endif%}
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description |default: "A beautiful
  Jekyll theme for creating resume" }}">

  <!-- Apply the chosen style before first paint (?style=… or the saved choice) -->
  <script>
    (function () {
      var ids = {{ site.data.data.styles | map: "id" | jsonify }};
      var style = null;
      try {
        style = new URLSearchParams(location.search).get("style") || localStorage.getItem("cv-style");
      } catch (e) {}
      if (ids.indexOf(style) < 0) style = ids[0];
      document.documentElement.setAttribute("data-style", style);
    })();
  </script>

  <!-- Favicon -->
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Global CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/bootstrap/css/bootstrap.css">

  <!-- Plugins CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/font-awesome/css/all.css">

  <!-- Theme CSS -->
  <link id="theme-style" rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css?v={{ site.time | date: "%s" }}">
</head>
