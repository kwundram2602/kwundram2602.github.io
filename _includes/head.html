<head>
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <!-- Meta -->
  <meta charset="utf-8">
  {% if site.chrome_mobile_color %}
  <meta name="theme-color" content="{{ site.chrome_mobile_color }}">
  {% endif%}
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.description |default: "A beautiful
  Jekyll theme for creating resume" }}">

  <!-- Apply the chosen style and palette before first paint (?style=… / ?palette=… or the saved choice) -->
  <script>
    (function () {
      function pick(param, key, ids) {
        var value = null;
        try {
          value = new URLSearchParams(location.search).get(param) || localStorage.getItem(key);
        } catch (e) {}
        if (ids.indexOf(value) < 0) value = ids[0];
        document.documentElement.setAttribute("data-" + param, value);
      }
      pick("style", "cv-style", {{ site.data.data.styles | map: "id" | jsonify }});
      pick("palette", "cv-palette", {{ site.data.data.palettes | map: "id" | jsonify }});
    })();
  </script>

  <!-- Favicon -->
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Global CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/bootstrap/css/bootstrap.css">

  <!-- Plugins CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/plugins/font-awesome/css/all.css">

  <!-- Theme CSS -->
  <link id="theme-style" rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css?v={{ site.time | date: "%s" }}">
</head>
